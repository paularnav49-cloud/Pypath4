name: Unzip files

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  unzip:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Unzip to repo root
        run: |
          unzip -o "PyPath-source.zip" -d .

      - name: Commit extracted files
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          git reset -- "PyPath-source (2).zip"
          git diff --cached --quiet || git commit -m "Unzip PyPath-source"
          git push
