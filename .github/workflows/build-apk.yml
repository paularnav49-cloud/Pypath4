name: Build APK

on:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Show project files
        run: find . -maxdepth 3 -not -path './.git/*'

      - name: Build debug APK
        run: |
          G=$(find . -name gradlew -not -path './.git/*' | head -n1)
          if [ -z "$G" ]; then
            echo "No gradlew found. Not a Gradle Android project, or the zip isn't unzipped yet."
            exit 1
          fi
          cd "$(dirname "$G")"
          chmod +x gradlew
          ./gradlew assembleDebug

      - uses: actions/upload-artifact@v4
        with:
          name: app-debug-apk
          path: "**/build/outputs/apk/debug/*.apk"
